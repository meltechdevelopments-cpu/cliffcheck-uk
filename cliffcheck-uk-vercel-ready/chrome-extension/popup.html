<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <title>CliffCheck UK</title>
  <style>
    body {
      width: 310px;
      margin: 0;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b1120;
      color: #f8fafc;
    }
    .head {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 15px;
      margin-bottom: 10px;
    }
    .gb {
      background: #facc15;
      color: #0f172a;
      font-weight: 900;
      font-size: 11px;
      padding: 3px 6px;
      border-radius: 4px;
    }
    .box {
      background: #131c31;
      border: 1px solid #283655;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      font-size: 12.5px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      background: #0b1120;
      border: 1px solid #283655;
      color: #fff;
      padding: 8px;
      border-radius: 7px;
      margin-bottom: 8px;
    }
    .btn {
      width: 100%;
      background: #facc15;
      color: #0f172a;
      border: none;
      padding: 9px;
      border-radius: 8px;
      font-weight: 900;
      cursor: pointer;
      text-decoration: none;
      display: block;
      text-align: center;
      box-sizing: border-box;
      font-size: 12.5px;
    }
  </style>
</head>
<body>
  <div class="head">
    <span class="gb">GB</span>
    <span>CliffCheck UK</span>
  </div>

  <div id="statusBox" class="box">Checking Pass status...</div>

  <div class="box">
    <div style="font-weight:700;margin-bottom:6px;">Activate 30-Day Pass Code:</div>
    <input id="keyInput" type="text" placeholder="Paste code from email receipt" />
    <button id="activateBtn" class="btn">Activate Unlimited Pass</button>
    <div id="msg" style="margin-top:6px;font-size:11.5px;color:#94a3b8;"></div>
  </div>

  <a id="buyBtn" href="#" target="_blank" class="btn" style="background:#1e293b;color:#facc15;border:1px solid #facc15;">
    Get 30-Day Pass (£9.99 Once) →
  </a>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
